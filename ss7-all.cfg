################################################################################
# 
# FILE: SccpAnsiHandler.cfg
# TYPE: Sample Configuration File
# MODULE: SCCP Aculab Handler (Kernel & IPC Configuration)
# AUTHOR: Abhishek Chhabra
# DESCRIPTION: 
#   Consolidated configuration for SCCP Inter-Process Communication (IPC) 
#   message queues, operational flags, and core routing destinations.
#
# WARNING: 
#   This is a SAMPLE configuration. IPC queue keys must be verified against the 
#   global system registry to prevent cross-process memory collisions.
#
# By Abhishek Chhabra
################################################################################

[ACULAB_SCCP_API]

# ------------------------------------------------------------------------------
# 1. Inter-Process Communication (IPC) Queue Keys
# ------------------------------------------------------------------------------
# System V IPC Message Queue keys for process isolation.
# These must be strictly unique across the entire host OS.
MSG_SCCP_HDLR_Q_RCV = 4100
MSG_SCCP_DEC_Q_RCV = 4101
MSG_SCCP_HEART_BEAT_Q_RCV = 4102

# ------------------------------------------------------------------------------
# 2. Operational Kernel Flags
# ------------------------------------------------------------------------------
# Enables statistical counters (pegging) for the SCCP sublayer.
# Type: Boolean (0 = Disabled, 1 = Enabled)
SCCP_PEG_REQUIRED = 1

# Controls the verbosity/format of SCCP message dumping.
# NOTE: The parameter key retains a legacy typo ("DIPLAY") to match the parser.
SCCP_MSG_DIPLAY_PARAM = 2

# ------------------------------------------------------------------------------
# 3. SCCP Routing Destinations
# ------------------------------------------------------------------------------
# Primary destination point code for SCCP routing.
# Range: 1 to 35000
SCCP_DESTINATION_1 = 1070

# Secondary/Backup destination point code for SCCP routing.
# Range: 1 to 35000. If parsing fails, defaults to 0.
SCCP_DESTINATION_2 = 35000

TCAP_LOOPBACK_SSN = 0
