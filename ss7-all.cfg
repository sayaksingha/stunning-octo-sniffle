################################################################################
# 
# FILE: TcapAculabHander.cfg
# MODULE: TCAP Aculab Handler
# DESCRIPTION: 
#   Configuration file for the TcapAculabHandler. Defines core 
#   operational parameters, timeouts, feature flags, and routing configurations 
#   for Point Codes (OPCs).
#
# NOTE: Boolean flags must be defined as integers (0 = False, 1 = True).
#
# Author: Abhishek Chhabra
################################################################################

[ACULAB_TCAP_API]

# ------------------------------------------------------------------------------
# Core Feature Flags
# ------------------------------------------------------------------------------

# Enables or disables the restoration procedure.
# Type: Boolean (0 or 1)
# Default (if omitted): 0
RESTORATION_REQUIRED = 0

# Determines if pegging (statistical counters) is required for TCAP.
# Type: Boolean (0 or 1)
TCAP_PEG_REQUIRED = 1

# Controls whether to set the local address on receive operations.
# Type: Boolean (0 or 1)
# Default (if omitted): 0
TCAP_DISABLE_RECV_LOCAL_ADDRESS = 0

# Flag to set the local Aculab TCAP address.
# Type: Boolean (0 or 1)
SET_LOCAL_ACU_TCAP_ADDR_FLAG = 1

# Flag to enable/disable Application Global Title (GT) relay.
# Type: Boolean (0 or 1)
# Default (if omitted): 0
SET_APP_GT_RELAY_FLAG = 1

# Flag to send a response timeout on pre-arranged end.
# Type: Boolean (0 or 1)
SEND_RSP_TIMEOUT_ON_PRE_ARR_END = 0

# ------------------------------------------------------------------------------
# Limits & Timeouts
# ------------------------------------------------------------------------------

# Maximum permitted dialog size in bytes/elements.
# Range: 1 to 500000
MAX_ACU_TCAP_DLG_SIZE = 500000

# Standard timeout for an Aculab TCAP Dialog.
# Range: DLG_TIMEOUT_MIN to DLG_TIMEOUT_MAX (Internal limits)
ACU_TCAP_DLG_TIMEOUT = 5000

# Cap limit for the dialog timeout.
# Range: DLG_TIMEOUT_MIN to 8000
ACU_TCAP_DLG_TIMEOUT_CAP = 8000

# Display parameter configuration for incoming/outgoing TCAP messages.
# Range: MIN_DIS_PARAM_VAL to MAX_DIS_PARAM_VAL (Internal limits)
TCAP_MSG_DISPLAY_PARAM = 63 

# ------------------------------------------------------------------------------
# Licensing
# ------------------------------------------------------------------------------

# Valid license key string for the TCAP messaging module.
# Max Length: TCAP_ACU_MAX_LIC_LEN
TCAP_MSG_LICENCE_KEY=41672380035391

# ------------------------------------------------------------------------------
# Originating Point Code (OPC) Routing Configuration
# ------------------------------------------------------------------------------

# Total number of Originating Point Codes defined below.
# If set to 0, the system falls back to reading 'LocalPC' from Tcap_<msgType>.cfg.
# Range: SS7_MIN_NO_OF_PC to SS7_MAX_NO_OF_PC
NUMBER_OF_OPC = 1 

# OPC Definitions.
# Syntax: OPC_<Index> = <PointCode>:<NumberOfInstances>
# Note: Index must start at 0 and increment sequentially up to NUMBER_OF_OPC - 1.
# Maximum instances per PC is governed by MAX_INSTANCE_PER_PC.
OPC_0 = 1071:1

# ------------------------------------------------------------------------------
# Inter-Process Communication (IPC) Queue Keys
# ------------------------------------------------------------------------------

# Message Queue Key for Receiving TCAP Handler messages.
# Maps to: mMsgQ.RdMsgQKey (Read Queue)
MSG_TCAP_HDLR_Q_RCV = 9733 

# Message Queue Key for Transmitting/Receiving to the TCAP Decoder.
# Maps to: mMsgQ.WrMsgQKey (Write Queue)
MSG_TCAP_DEC_Q_RCV = 9734

# Message Queue Key for Receiving Heartbeat/Keepalive messages.
# Maps to: mMsgQ.RdHbQKey (Heartbeat Read Queue)
MSG_TCAP_HEART_BEAT_Q_RCV = 4098

SEM_IN_DLG_KEY = 9914
SHM_IN_DLG_POOL_KEY = 9839
SHM_DLG_MGMT_QUEUE_KEY = 9840

ACU_TCAP_IN_DLG_SHIFT_INDX=2000

