################################################################################
# FILE: TcapAnsiMsgFileConfig.cfg
# TYPE: TCAP Test Message Configuration (ITU Standard - ITU Q.713/Q.714)
# NODES: Server 71 (PC=1071) <--> Server 70 (PC=1070)
# AUTHOR: Abhishek Chhabra
#
# USAGE:
#   export PRODUCT_HOME=/opt/ss7
#   export PRODUCT_CFG_PATH=etc/config
#   ./TCAP_FileConfigStub TcapAnsiMsgFileConfig.cfg TCAP_NewWriteMsg
#
# KEYWORDS:
#   ITU_BEGIN     - TCAP BEGIN    (New dialogue, INVOKE comp, OpCode=45)
#   ITU_CONT      - TCAP CONTINUE (Existing dlg, INVOKE comp)
#   ITU_END       - TCAP END      (Basic End, ReturnResult comp)
#   ITU_END_ALONE - TCAP END      (No component, basic termination)
#   ITU_END_PRE   - TCAP END      (Pre-Arranged End, no network msg)
#   ITU_ABORT     - TCAP ABORT    (User Abort)
#   ITU_BEGIN_ACN - TCAP BEGIN    (With full Application Context)
#
# ITU ADDRESS PARAMETERS:
#   OPC = 1071 (Server 71), DPC = 1070 (Server 70)
#   NP=1 (ISDN/Telephony), ES=2 (BCD Even), NOA=4 (International)
#   TT=0  O_GT=919821900008  D_GT=919821900009
#   QUEUE KEY = 9733 (TcapAnsiHandler write queue)
#
# FORMAT: KEYWORD--KEY:VAL!KEY:VAL!...!END
#
# SPECIAL: ASK=prompt at runtime  ZERO=not present  SKIP=skip param
#
# DLG_TYPE:  1=BEGIN 2=CONTINUE 3=END(Basic) 4=ABORT 5=END(PreArranged)
# COMP_TYPE: 1=INVOKE 2=ReturnResult 3=ReturnError 4=Reject 5=Abort
################################################################################

# ==============================================================================
# ITU_BEGIN : Send TCAP BEGIN with INVOKE Component (OpCode=45)
# Creates a new dialogue from Server 71 --> Server 70
# AppContext: 04 00 00 01 00 15 03 0A (APPL_CONTEXT=21=0x15, ACN_VER=3=0x03)
# ==============================================================================
ITU_BEGIN--QKEY:9733!O_AI:18!O_SSN:8!O_PT:1071!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900008!D_AI:18!D_SSN:8!D_PT:1070!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900009!ISACN:1!ISUSERINFO:0!DLG_TYPE:1!COMP_PRESENT:1!INVOKEID:1!COMPONENT_TYPE:1!OPCODE:45!LAST_INDICATOR:1!REJECT_TYPE:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:1!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:21!ACN_VER:3!PARAM_DATA:ZERO!END

# ==============================================================================
# ITU_CONT : Send TCAP CONTINUE with INVOKE Component
# Continues an existing dialogue (DlgId from server 70 RX log)
# ==============================================================================
ITU_CONT--QKEY:9733!O_AI:18!O_SSN:8!O_PT:1071!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900008!D_AI:18!D_SSN:8!D_PT:1070!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900009!ISACN:0!ISUSERINFO:0!DLG_TYPE:2!COMP_PRESENT:1!INVOKEID:2!COMPONENT_TYPE:1!OPCODE:45!LAST_INDICATOR:0!REJECT_TYPE:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:2!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# ITU_END : Send TCAP END (Basic End) with ReturnResult Component
# Terminates dialogue gracefully with a result
# DLGID = match existing DlgId on server 71 (from TX log)
# O_TRANSID = origTransId of the original BEGIN
# ==============================================================================
ITU_END--QKEY:9733!O_AI:18!O_SSN:8!O_PT:1071!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900008!D_AI:18!D_SSN:8!D_PT:1070!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900009!ISACN:0!ISUSERINFO:0!DLG_TYPE:3!COMP_PRESENT:1!INVOKEID:1!COMPONENT_TYPE:2!OPCODE:45!LAST_INDICATOR:1!REJECT_TYPE:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:3!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# ITU_END_ALONE : Send TCAP END (Basic End) WITHOUT any Component
# Simple dialogue termination with no result payload
# ==============================================================================
ITU_END_ALONE--QKEY:9733!O_AI:18!O_SSN:8!O_PT:1071!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900008!D_AI:18!D_SSN:8!D_PT:1070!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900009!ISACN:0!ISUSERINFO:0!DLG_TYPE:3!COMP_PRESENT:0!INVOKEID:0!COMPONENT_TYPE:0!OPCODE:0!LAST_INDICATOR:0!REJECT_TYPE:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:3!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# ITU_END_PRE : Send TCAP PRE-ARRANGED END (No network message sent)
# Used when both sides agreed to end — silent local cleanup
# ==============================================================================
ITU_END_PRE--QKEY:9733!O_AI:18!O_SSN:8!O_PT:1071!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900008!D_AI:18!D_SSN:8!D_PT:1070!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900009!ISACN:0!ISUSERINFO:0!DLG_TYPE:5!COMP_PRESENT:0!INVOKEID:0!COMPONENT_TYPE:0!OPCODE:0!LAST_INDICATOR:0!REJECT_TYPE:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:3!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# ITU_ABORT : Send TCAP ABORT (User Abort, abortType=1)
# Hard termination of dialogue
# ==============================================================================
ITU_ABORT--QKEY:9733!O_AI:18!O_SSN:8!O_PT:1071!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900008!D_AI:18!D_SSN:8!D_PT:1070!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900009!ISACN:0!ISUSERINFO:0!DLG_TYPE:4!COMP_PRESENT:1!INVOKEID:0!COMPONENT_TYPE:5!OPCODE:1!LAST_INDICATOR:1!REJECT_TYPE:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:4!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# ITU_BEGIN_ACN : TCAP BEGIN with Full App Context (ITU Q.775 MAP style)
# AppContext OID: 04 00 00 01 00 15 03 0A
# ==============================================================================
ITU_BEGIN_ACN--QKEY:9733!O_AI:18!O_SSN:8!O_PT:1071!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900008!D_AI:18!D_SSN:8!D_PT:1070!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900009!ISACN:1!ISUSERINFO:0!DLG_TYPE:1!COMP_PRESENT:1!INVOKEID:1!COMPONENT_TYPE:1!OPCODE:45!LAST_INDICATOR:1!REJECT_TYPE:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:1!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:21!ACN_VER:3!PARAM_DATA:ZERO!END
