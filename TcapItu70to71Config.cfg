################################################################################
# FILE: TcapItu70to71Config.cfg
# PURPOSE: TCAP Stub Test Messages from SERVER 70 --> SERVER 71
# AUTHOR: 
#
# SERVER 70 (Tayana, IPSP Server):
#   IP      : 10.0.3.70
#   LocalPC : 1070
#   Variant : ITU,  NI=2
#   O_GT    : 919821900009  (Server 70 own GT)
#   SSN     : 8
#
# SERVER 71 (Aculab, ASP Client):
#   IP      : 10.0.3.71
#   RemotePC: 1071
#   Variant : ITU,  NI=2
#   D_GT    : 919821900008  (Server 71 own GT)
#   SSN     : 8
#
# GT ROUTING (Server 70 gt_translate.cfg):
#   Table: SccpTableE214  tt=0, np=1, es=2
#   919821900009 --> 1070 (local)
#   default      --> 1071 (remote = server 71) <-- D_GT=919821900008 matches here
#
# GT ROUTING (Server 71 gt_translate.cfg):
#   Table: SccpTableE214TT0  tt=0, np=1, es=2  (newly added)
#   919821900008 --> 1071 (local = server 71)  <-- server 71 delivers to SSN=8
#   default      --> 1070 (remote = server 70)
#
# FIND QKEY on Server 70:
#   grep -i "qkey\|rdq\|queue" /opt/ss7/etc/config/TcapAnsiHandler.cfg
#   ipcs -q | grep ss7
#
# USAGE:
#   export PRODUCT_HOME=/opt/ss7
#   export PRODUCT_CFG_PATH=etc/config
#   cp TcapItu70to71Config.cfg /opt/ss7/etc/config/
#   ./TCAP_FileConfigStub TcapItu70to71Config.cfg TCAP_NewWriteMsg
#
# FORMAT: KEYWORD--KEY:VAL!KEY:VAL!...!END
# NOTE: REJECT_TYPE must come BEFORE LAST_INDICATOR (both map to index 23)
#
# DLG_TYPE:  1=BEGIN 2=CONTINUE 3=END(Basic) 4=ABORT 5=END(PreArranged)
# COMP_TYPE: 1=INVOKE 2=ReturnResult 3=ReturnError 4=Reject 5=Abort
################################################################################

# ==============================================================================
# BEGIN70 : TCAP BEGIN from Server 70 --> Server 71
#   Origin : PC=1070, GT=919821900009, SSN=8
#   Dest   : PC=1071, GT=919821900008, SSN=8
#   Component: INVOKE, OpCode=45
#   AppCtx : 04 00 00 01 00 15 03 (APPL_CONTEXT=21=0x15, ACN_VER=3=0x03)
# ==============================================================================
BEGIN70--QKEY:ASK!O_AI:18!O_SSN:8!O_PT:1070!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900009!D_AI:18!D_SSN:8!D_PT:1071!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900008!ISACN:1!ISUSERINFO:0!DLG_TYPE:1!COMP_PRESENT:1!INVOKEID:1!COMPONENT_TYPE:1!OPCODE:45!REJECT_TYPE:0!LAST_INDICATOR:1!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:1!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:21!ACN_VER:3!PARAM_DATA:ZERO!END

# ==============================================================================
# CONT70 : TCAP CONTINUE from Server 70 --> Server 71
#   Use DLGID and O_TRANSID from BEGIN70's dialogue
# ==============================================================================
CONT70--QKEY:ASK!O_AI:18!O_SSN:8!O_PT:1070!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900009!D_AI:18!D_SSN:8!D_PT:1071!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900008!ISACN:0!ISUSERINFO:0!DLG_TYPE:2!COMP_PRESENT:1!INVOKEID:2!COMPONENT_TYPE:1!OPCODE:45!REJECT_TYPE:0!LAST_INDICATOR:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:2!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# END70 : TCAP Basic END from Server 70 --> Server 71 (with ReturnResult)
#   DLGID and O_TRANSID must match existing dialogue from BEGIN70
# ==============================================================================
END70--QKEY:ASK!O_AI:18!O_SSN:8!O_PT:1070!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900009!D_AI:18!D_SSN:8!D_PT:1071!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900008!ISACN:0!ISUSERINFO:0!DLG_TYPE:3!COMP_PRESENT:1!INVOKEID:1!COMPONENT_TYPE:2!OPCODE:45!REJECT_TYPE:0!LAST_INDICATOR:1!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:3!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# END70_ALONE : TCAP Basic END from Server 70 --> Server 71 (no component)
# ==============================================================================
END70_ALONE--QKEY:ASK!O_AI:18!O_SSN:8!O_PT:1070!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900009!D_AI:18!D_SSN:8!D_PT:1071!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900008!ISACN:0!ISUSERINFO:0!DLG_TYPE:3!COMP_PRESENT:0!INVOKEID:0!COMPONENT_TYPE:0!OPCODE:0!REJECT_TYPE:0!LAST_INDICATOR:0!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:3!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END

# ==============================================================================
# ABORT70 : TCAP ABORT from Server 70 --> Server 71 (User Abort)
# ==============================================================================
ABORT70--QKEY:ASK!O_AI:18!O_SSN:8!O_PT:1070!O_NOA:4!O_TT:0!O_NP:1!O_GT:919821900009!D_AI:18!D_SSN:8!D_PT:1071!D_NOA:4!D_TT:0!D_NP:1!D_GT:919821900008!ISACN:0!ISUSERINFO:0!DLG_TYPE:4!COMP_PRESENT:1!INVOKEID:0!COMPONENT_TYPE:5!OPCODE:1!REJECT_TYPE:0!LAST_INDICATOR:1!DLGID:ASK!HDLR_SSN:8!MSG_TYPE:4!O_TRANSID:ASK!TCUSERID:0!USERINFO:ZERO!APPL_CONTEXT:0!ACN_VER:0!PARAM_DATA:ZERO!END
