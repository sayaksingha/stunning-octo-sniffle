################################################################################
# FILE: TcapItuMsgFileConfig.cfg
# TYPE: TCAP Test Message Configuration (ITU Standard - ITU Q.713/Q.714)
# AUTHOR: Abhishek Chhabra
#
# TWO SETS OF KEYWORDS:
#
# From SERVER 71 (PC=1071) --> SERVER 70 (PC=1070):
#   ITU_BEGIN     - TCAP BEGIN (INVOKE, OpCode=45)
#   ITU_CONT      - TCAP CONTINUE
#   ITU_END       - TCAP END (Basic End, ReturnResult)
#   ITU_END_ALONE - TCAP END (No component)
#   ITU_ABORT     - TCAP ABORT
#
# From SERVER 70 (PC=1070) --> SERVER 71 (PC=1071):
#   ITU70_BEGIN     - TCAP BEGIN (INVOKE, OpCode=45)
#   ITU70_CONT      - TCAP CONTINUE
#   ITU70_END       - TCAP END (Basic End, ReturnResult)
#   ITU70_END_ALONE - TCAP END (No component)
#   ITU70_ABORT     - TCAP ABORT
#
# USAGE (Server 71):
#   export PRODUCT_HOME=/opt/ss7
#   export PRODUCT_CFG_PATH=etc/config
#   ./TCAP_FileConfigStub TcapItuMsgFileConfig.cfg TCAP_NewWriteMsg
#   Keyword: ITU_BEGIN
#
# USAGE (Server 70):
#   export PRODUCT_HOME=/opt/ss7
#   export PRODUCT_CFG_PATH=etc/config
#   ./TCAP_FileConfigStub TcapItuMsgFileConfig.cfg TCAP_NewWriteMsg
#   Keyword: ITU70_BEGIN
#
# FORMAT: KEYWORD--KEY:VAL!KEY:VAL!...!END
# SPECIAL: ASK=prompt  ZERO=not present
#
# DLG_TYPE:  1=BEGIN 2=CONTINUE 3=END(Basic) 4=ABORT 5=END(PreArranged)
# COMP_TYPE: 1=INVOKE 2=ReturnResult 3=ReturnError 4=Reject 5=Abort
#
# NOTE: REJECT_TYPE must come BEFORE LAST_INDICATOR (both use index 23)
#       Last one wins, so LAST_INDICATOR must be last to take effect.
################################################################################

# ==============================================================================
# SERVER 71 --> SERVER 70
